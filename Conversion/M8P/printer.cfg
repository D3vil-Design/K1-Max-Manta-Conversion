[include mainsail.cfg]
# K1 Hybrid Conversion Profile
# Mainboard: BigTreeTech Manta M8P v2.0 (Pins fully updated)
# Toolheads: Stock Creality K1 Nozzle MCU & Leveling MCU (Routed via usb-path)
# Kinematics: CoreXY (220x220x250 footprint)

[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 140

[include sensorless.cfg]
[include gcode_macro.cfg]

[exclude_object]
[respond]

[pause_resume]
recover_velocity: 100

[save_variables]
filename: /home/biqu/printer_data/config/variables.cfg

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes

# ======================================================================
# --- MCU DEFINITIONS (Manta M8P Native + K1 Sub-MCU USB Routing) ---
# ======================================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_0E0022000A504B4633373520-if00
restart_method: command

[mcu CB1] 
serial: /tmp/klipper_host_mcu

[mcu leveling_mcu]
serial: /dev/serial/by-path/platform-5200000.usb-usb-0:1.3:1.0-port0
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/serial/by-path/platform-5200000.usb-usb-0:1.2:1.0-port0
baud: 230400
restart_method: command

[temperature_sensor Manta_M8P]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[verify_heater extruder]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[idle_timeout]
timeout: 99999999

[gcode_arcs]
resolution: 0.1

# ======================================================================
# --- STEPPER X CONFIGURATION (MOTOR 1 SLOT ON MANTA) ---
# ======================================================================

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 72
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_speed: 36
homing_retract_dist: 0
microsteps: 32
position_endstop: 229
position_min: -5
position_max: 229

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: True
run_current: 1.5
sense_resistor: 0.100
stealthchop_threshold: 0
diag_pin: ^PF4
driver_SGTHRS: 65

# ======================================================================
# --- STEPPER Y CONFIGURATION (MOTOR 2 SLOT ON MANTA) ---
# ======================================================================

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 72
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_speed: 36
homing_retract_dist: 0
position_endstop: -0.5
position_min: -0.5
position_max: 226
microsteps: 32

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 1.5
sense_resistor: 0.100
stealthchop_threshold: 0
diag_pin: ^PF3
driver_SGTHRS: 65

# ======================================================================
# --- STEPPER Z CONFIGURATION (MOTOR 3 SLOT ON MANTA) ---
# ======================================================================

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: tmc2209_stepper_z:virtual_endstop
second_homing_speed: 1 
homing_retract_dist: 2.0
position_endstop: 0
position_max: 255
position_min: -5

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.8
diag_pin: ^PB14
stealthchop_threshold: 0
driver_SGTHRS: 0
sense_resistor: 0.100

# ======================================================================
# --- EXTRUDER & HEATER BED CONFIGURATION ---
# ======================================================================

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance_smooth_time: 0.02
rotation_distance: 6.693
control: pid
pid_Kp: 25.013
pid_Ki: 2.566
pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

[heater_bed]
heater_pin: PF5         # Manta M8P Bed Pin
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0         # Manta M8P TB Pin Header
control: pid
pid_kp: 27
pid_ki: 0.08
pid_kd: 0
min_temp: 0
max_temp: 120

# ======================================================================
# --- SENSORS & RUNOUT SYSTEM ---
# ======================================================================

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !PC15  # Manta M6-STOP hardware endstop input mapping
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[filament_switch_sensor filament_sensor_2]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB1  # Wired to Manta M8P TB Header
min_temp: 0
max_temp: 125

# ======================================================================
# --- FAN & K1 SYSTEM MULTI-FAN EXTENSIONS ---
# ======================================================================

[duplicate_pin_override]
pins: PF9, PB1

[multi_pin heater_fans]
pins: nozzle_mcu:PB5, nozzle_mcu:PB2

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu: PB6

[fan] # Nozzle part cooling fan
pin: !nozzle_mcu: PB8
cycle_time: 0.0100
hardware_pwm: false 
kick_start_time: 0.2
shutdown_speed: 0
max_power: 1.0

[fan_generic auxiliary] # Side aux fan (Mapped to Manta FAN0)
pin: PF7
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.100
cycle_time: 0.002
hardware_pwm: false

[fan_generic chamber] # Rear exhaust fan (Mapped to Manta FAN1)
pin: PF9
shutdown_speed: 0.0
kick_start_time: 0.100
cycle_time: 0.0100
hardware_pwm: false

[temperature_fan chamber_fan]
pin: PF9
cycle_time: 0.0100
hardware_pwm: false 
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB1
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

[output_pin LED]
pin: PA4  # Manta Mainboard LED Port
pwm: True
cycle_time: 0.010
value: 1

# ======================================================================
# --- KINEMATICS ACCELEROMETER MAPPING ---
# ======================================================================

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points:
   110,110,10

# ======================================================================
# --- STRAIN-GAUGE BED LEVELING (ROUTED TO ORIGINAL LEVELING MCU) ---
# ======================================================================

[hx711s]
count: 4
use_mcu: leveling_mcu
sensor0_clk_pin: leveling_mcu:PA5
sensor1_clk_pin: leveling_mcu:PA2
sensor2_clk_pin: leveling_mcu:PA6
sensor3_clk_pin: leveling_mcu:PA7
sensor0_sdo_pin: leveling_mcu:PA1
sensor1_sdo_pin: leveling_mcu:PA0
sensor2_sdo_pin: leveling_mcu:PA3
sensor3_sdo_pin: leveling_mcu:PA4

[prtouch]
z_offset: 0
max_press_cnt: 5
base_count: 40
pi_count: 64
min_hold: 2000
max_hold: 60000
s_hot_min_temp: 160
s_hot_max_temp: 200
s_bed_max_temp: 60
pa_fil_len_mm: 5
pa_fil_dis_mm: 30
pa_clr_dis_mm: 30
bed_max_err: 4
max_dis_bef_g28: 0
dead_zone_bef_g28: 0
g28_sta0_speed: 2.5
g28_sta1_speed: 1.25
g29_rdy_speed: 1.5
g29_speed: 1.25
show_msg: false
g28_wait_cool_down: true
need_measure_gap: true
pa_clr_down_mm: -0.15
clr_noz_start_x: 130
clr_noz_start_y: 220
clr_noz_len_x: 40
clr_noz_len_y: 2
fix_z_offset: 0.06
z_gap_00: 0.03
z_gap_01: 0.03
z_gap_10: -0.03
z_gap_11: -0.03
shake_cnt: 15
shake_max_velocity: 200
shake_max_accel: 500
gap_dis_range: 0.4

[filter]
hft_hz: 1
lft_k1: 0.3
lft_k1_oft: 0.95
lft_k1_cal: 0.95

[dirzctl]
use_mcu: mcu
step_base: 2

[bed_mesh]
zero_reference_position: 112,112
speed: 150
mesh_min: 5,5
mesh_max: 200,200
probe_count: 6,6
algorithm: bicubic
bicubic_tension: 0.1

# ======================================================================
# --- MOTION PROFILE ---
# ======================================================================

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
max_accel_to_decel: 20000
max_z_velocity: 20
square_corner_velocity: 5.0
max_z_accel: 300